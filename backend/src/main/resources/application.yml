spring:
  application:
    name: skillpulse
  datasource:
    url: jdbc:mysql://localhost:3306/skillpulse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password:
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}

skillpulse:
  jwt:
    # Must be at least 32 characters. Override JWT_SECRET in every real environment.
    secret: ${JWT_SECRET:dev-only-skillpulse-secret-key-change-me-0123456789}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:admin@skillpulse.local}
    password: ${ADMIN_PASSWORD:ChangeMe123!}
    full-name: SkillPulse Admin
