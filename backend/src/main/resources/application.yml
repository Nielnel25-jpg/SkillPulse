spring:
  application:
    name: skillpulse
  datasource:
    url: jdbc:mysql://localhost:3306/skillpulse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password:
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}
